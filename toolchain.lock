# Stratum Toolchain and Dependency Lock
# Target: x86-64 freestanding (kernel) and UEFI application (loader)
# Host: Darwin arm64 / Apple Silicon (with TCG cross-emulation)

[host]
os = "Darwin"
arch = "arm64"

[compiler]
name = "clang"
version = "23.1.2"
package = "Homebrew llvm 23.1.2"
path = "/opt/homebrew/opt/llvm/bin/clang"

[linker]
name = "lld"
version = "23.1.2"
package = "Homebrew lld 23.1.2"
path = "/opt/homebrew/opt/llvm/bin/ld.lld"

[assembler]
name = "nasm"
version = "2.16.03"
package = "Homebrew nasm"
path = "/opt/homebrew/bin/nasm"

[objcopy]
name = "llvm-objcopy"
version = "23.1.2"
path = "/opt/homebrew/opt/llvm/bin/llvm-objcopy"

[image_tools]
mformat_path = "/opt/homebrew/bin/mformat"
mcopy_path = "/opt/homebrew/bin/mcopy"
version = "4.0.49"

[emulator]
name = "qemu-system-x86_64"
version = "11.1.1"
package = "Homebrew qemu 11.1.1"
path = "/opt/homebrew/bin/qemu-system-x86_64"

[firmware]
name = "edk2-x86_64-code.fd"
version = "OVMF EDK2"
path = "/opt/homebrew/share/qemu/edk2-x86_64-code.fd"
sha256 = "33090cc07675baa5190d9f1e84bf5176b33bcbfa9bacac522961150cdb6dbb2a"
